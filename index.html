<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GIS Dashboard</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />

</head>

<body>

  <!-- Navbar -->
  <header class="navbar">

    <!-- Logo Image -->
    <div class="nav-left">
      <img src="assets/logo.png" alt="Logo" class="nav-logo">
    </div>

    <!-- Title -->
    <div class="nav-center">
      GIS Analytics Dashboard
    </div>

    <!-- Actions -->
    <div class="nav-actions">

      <button id="locateBtn">
        📍 Current Location
      </button>

      <button id="exportMapBtn">🖨️ Export Map</button>

      <label class="theme-switch">

        <input type="checkbox" id="themeToggle">

        <span class="slider"></span>

      </label>

    </div>

  </header>

  <!-- Main Layout -->
  <main class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">


      <!-- GeoJSON Upload -->
      <div class="panel">

        <h2>GeoJSON Upload</h2>

        <input type="file" id="geojsonInput" accept=".geojson,.json" />

        <div id="layerList" class="layer-list"></div>


      </div>
      <div class="panel">

        <h2>Shapefile Upload</h2>


        <div class="shape-upload-grid">

          <label class="shape-card">

            <span>Geometry</span>
            <small>.shp</small>

            <div class="file-name" id="name_shp">
              No file selected
            </div>

            <input type="file" id="shp_shp" accept=".shp">

          </label>


          <label class="shape-card">

            <span>Index</span>
            <small>.shx</small>

            <div class="file-name" id="name_shx">
              No file selected
            </div>

            <input type="file" id="shp_shx" accept=".shx">

          </label>


          <label class="shape-card">

            <span>Attributes</span>
            <small>.dbf</small>

            <div class="file-name" id="name_dbf">
              No file selected
            </div>

            <input type="file" id="shp_dbf" accept=".dbf">

          </label>


          <label class="shape-card">

            <span>Projection</span>
            <small>.prj</small>

            <div class="file-name" id="name_prj">
              No file selected
            </div>

            <input type="file" id="shp_prj" accept=".prj">

          </label>

        </div>

        <div class="shape-buttons">

          <button id="resetShpBtn">
            Reset
          </button>

          <button id="loadShpBtn">
            Load Shapefile
          </button>

        </div>

      </div>

      <!-- Buffer -->
      <div class="panel">

        <h2>Buffer Analysis</h2>

        <label>Radius (km)</label>

        <input type="range" id="bufferRadius" min="1" max="50" value="25" />

        <div class="buffer-info">
          Radius: <span id="radiusValue">25</span> km
        </div>

        <button id="createBuffer">
          Create Buffer
        </button>
      </div>

    </aside>


    <!-- Map -->
    <section id="map"></section>

  </main>
  <footer class="status-bar">

    <div class="status-left">

      <span>
        🔎 Zoom:
        <strong id="zoomLevel">--</strong>
      </span>

      <span>
        📍 Coordinates:
        <strong id="coordinates">
          --
        </strong>
      </span>

      <span>
        🧩 Features:
        <strong id="geometryCount">
          0
        </strong>
      </span>

      <span>
        📏 Distance:
        <strong id="distanceValue">
          0 km
        </strong>
      </span>

    </div>

    <div class="status-right">

      <span>
        🌍 GIS Dashboard
      </span>

      <span>
        ©
        <a href="mailto:arindam.ojha@afpl.net.in?subject=GIS Dashboard Feedback" class="footer-link">
          afpl-arindam
        </a>
      </span>

    </div>

  </footer>

  <!-- Attribute Table Modal -->

  <div id="attributeModal" class="attribute-modal">

    <div class="attribute-container">

      <div class="attribute-header">

        <h2>Attribute Table</h2>

        <button id="closeAttribute">
          ✕
        </button>

      </div>

      <input type="text" id="attributeSearch" placeholder="Search attributes..." />

      <div class="attribute-table-wrapper">

        <table id="attributeTable">

          <thead></thead>

          <tbody></tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Turf.js -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>

  <!-- JS Modules -->
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/geojson.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
